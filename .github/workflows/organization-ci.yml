name: Organization CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-repository-hygiene.yml@v1
  node:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-node-ci.yml@v1
    with:
      node-version: "22"
      package-manager: npm
      cache-dependency-path: package-lock.json
      working-directory: .
      install-command: npm ci
      enable-lint: true
      enable-typecheck: true
      enable-tests: true
      enable-build: true
      lint-command: npm run format:check
      typecheck-command: npm run typecheck
      test-command: npm test
      build-command: npm run build
